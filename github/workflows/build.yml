name: Compilar ELF para PS2
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con ps2dev
        run: docker run --rm -v "$PWD:/src" -w /src ps2dev/ps2dev:latest sh -c 'export GSKIT=$PS2DEV/gsKit; make clean; make'
      - uses: actions/upload-artifact@v4
        with:
          name: punto-cero-elf
          path: punto-cero.elf
